name: Damu CI

on:
  push:
    branches: [ "main", "master", "dev", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff jsonschema

      - name: Bytecode compilation check
        run: |
          python -m compileall -q main.py config.py cogs services builder utils tests

      - name: Run linting (Ruff)
        run: |
          ruff check builder services tests --ignore E501,F401,F841 || true

      - name: Run test suite (pytest)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

